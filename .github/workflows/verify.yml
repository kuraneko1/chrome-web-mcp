name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # The Linux job must stay keyed "test": branch protection on main requires the
  # "test (3.10)" and "test (3.13)" checks, and renaming the job silently makes
  # those checks unreportable, which blocks every pull request from merging.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils
          # Ubuntu 23.10+ restricts unprivileged user namespaces through AppArmor,
          # which leaves Chrome (155+) with no usable sandbox and it aborts with
          # "FATAL:zygote_host_impl_linux.cc] No usable sandbox!". The runner
          # allows relaxing the restriction, which keeps Chrome's real sandbox
          # enabled for the browser tests instead of falling back to --no-sandbox.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi
          google-chrome --version
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]' build
      - name: Run deterministic tests including real-browser security fixtures
        env:
          CW_DISPLAY_MODE: xvfb
          TMPDIR: ${{ runner.temp }}
        run: python -m pytest -q -m 'not live'
      - name: TEMP diagnose xauth Chrome launch
        if: always()
        env:
          TMPDIR: ${{ runner.temp }}
        run: python tests/_xauth_probe.py
      - name: Build wheel and source distribution
        run: python -m build

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]' build
      - name: Install project-local Chrome for Testing
        run: python scripts/install-chrome-for-testing.py
      - name: Show selected Chrome
        run: |
          python - <<'PY'
          from chrome_web_mcp.platform_runtime import discover_chrome, chrome_version
          browser = discover_chrome()
          print(browser)
          print(chrome_version(browser))
          PY
      - name: Run deterministic tests including real-browser security fixtures
        env:
          CW_DISPLAY_MODE: headless
          TMPDIR: ${{ runner.temp }}
        run: python -m pytest -q -m 'not live'

  test-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build non-root image
        run: docker build -t chrome-web-mcp:test .
      - name: Verify sandboxed Chrome and MCP without Internet
        run: |
          docker run --rm -i --network none --security-opt seccomp=docker/seccomp_profile.json --entrypoint python chrome-web-mcp:test - < tests/docker_smoke.py
          docker run --rm -i --network none --user 1001:1001 -e HOME=/tmp --security-opt seccomp=docker/seccomp_profile.json --entrypoint python chrome-web-mcp:test - --xephyr < tests/docker_smoke.py
