name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils
          google-chrome --version
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]' build
      - name: Run deterministic tests including real-browser security fixtures
        env:
          CW_DISPLAY_MODE: xvfb
          TMPDIR: ${{ runner.temp }}
        run: python -m pytest -q -m 'not live'
      - name: Build wheel and source distribution
        run: python -m build

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]' build
      - name: Install project-local Chrome for Testing
        run: python scripts/install-chrome-for-testing.py
      - name: Show selected Chrome
        run: |
          python - <<'PY'
          from chrome_web_mcp.platform_runtime import discover_chrome, chrome_version
          browser = discover_chrome()
          print(browser)
          print(chrome_version(browser))
          PY
      - name: Run deterministic tests including real-browser security fixtures
        env:
          CW_DISPLAY_MODE: headless
          TMPDIR: ${{ runner.temp }}
        run: python -m pytest -q -m 'not live'
