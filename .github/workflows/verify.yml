name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils
          google-chrome --version
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]' build
      - name: Run deterministic tests including real-browser security fixtures
        env:
          CW_DISPLAY_MODE: xvfb
          TMPDIR: ${{ runner.temp }}
        run: python -m pytest -q -m 'not live'
      - name: Build wheel and source distribution
        run: python -m build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build non-root image
        run: docker build -t chrome-web-mcp:test .
      - name: Verify sandboxed Chrome and MCP without Internet
        run: |
          docker run --rm -i --network none --security-opt seccomp=docker/seccomp_profile.json --entrypoint python chrome-web-mcp:test - < tests/docker_smoke.py
          docker run --rm -i --network none --user 1001:1001 -e HOME=/tmp --security-opt seccomp=docker/seccomp_profile.json --entrypoint python chrome-web-mcp:test - --xephyr < tests/docker_smoke.py
