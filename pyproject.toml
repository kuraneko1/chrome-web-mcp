[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "chrome-web-mcp"
version = "0.2.0"
description = "Safe JavaScript-rendered Google search and public URL fetch MCP server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp==1.28.0",
  "httpx==0.28.1",
  "websockets==16.0",
  "trafilatura>=2.2.0",
  "html2text>=2025.4.15",
  "psutil>=7,<8",
]

[project.scripts]
chrome-web-mcp = "chrome_web_mcp.server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/chrome_web_mcp"]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
markers = ["live: requires public Internet and Google (may encounter CAPTCHA)"]
